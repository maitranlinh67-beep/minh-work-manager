<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <title>Minh Work · Quản lý Đơn hàng & Dòng tiền</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="setView('overview', document.querySelector('[data-view=overview]'))" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setView('overview', document.querySelector('[data-view=overview]'));}" role="button" tabindex="0" aria-label="Về trang tổng quan">
        <div class="brandmark">M</div>
        <div class="brandname">
          <span>Minh Work</span>
          <small id="today">Quản lý đơn & dòng tiền</small>
        </div>
      </div>
      <div class="topright">
        <span class="save-status" id="saveStatus" title="Dữ liệu tự động lưu trên trình duyệt này">✓ Đã lưu tự động</span>
        <div class="data-tools">
          <button type="button" class="btn subtle small" onclick="openHistoryTab()" title="Xem lịch sử mọi lần chỉnh sửa">
            🕒 Lịch sử
          </button>
          <button type="button" class="btn subtle small" onclick="document.getElementById('importFile').click()" title="Khôi phục dữ liệu từ tệp JSON">
            ↑ Khôi phục
          </button>
          <button type="button" class="btn subtle small" onclick="exportData()" title="Tải tệp sao lưu JSON về máy">
            ↓ Sao lưu
          </button>
          <input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(event)">
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="side" aria-label="Menu chính">
      <div class="nav-group">
        <button type="button" class="nav active" data-view="overview" onclick="setView('overview',this)">
          <span class="ico nav-dot c-emerald" aria-hidden="true">⊞</span>
          <span class="nav-label">Tổng quan</span>
          <span class="nav-count warn hidden" id="todoCount">0</span>
        </button>
        <button type="button" class="nav" data-view="orders" onclick="setView('orders',this)">
          <span class="ico nav-dot c-blue" aria-hidden="true">🧮</span>
          <span class="nav-label">Note đơn · Tính lãi</span>
          <span class="nav-count" id="orderCount">0</span>
        </button>
        <button type="button" class="nav" data-view="finance" onclick="setView('finance',this)">
          <span class="ico nav-dot c-amber" aria-hidden="true">📊</span>
          <span class="nav-label">Thu chi & Báo cáo</span>
          <span class="nav-count warn hidden" id="debtCount" title="Khoản công nợ cần thu/trả">0</span>
        </button>
        <button type="button" class="nav" data-view="shipments" onclick="setView('shipments',this)">
          <span class="ico nav-dot c-indigo" aria-hidden="true">📦</span>
          <span class="nav-label">Đơn ký gửi</span>
          <span class="nav-count" id="shipCount">0</span>
        </button>
        <button type="button" class="nav" data-view="purchases" onclick="setView('purchases',this)">
          <span class="ico nav-dot c-pink" aria-hidden="true">🛍</span>
          <span class="nav-label">Mua hộ</span>
          <span class="nav-count" id="buyCount">0</span>
        </button>
        <button type="button" class="nav" data-view="customers" onclick="setView('customers',this)">
          <span class="ico nav-dot c-teal" aria-hidden="true">👤</span>
          <span class="nav-label">Khách hàng</span>
          <span class="nav-count" id="custCount">0</span>
        </button>
      </div>

      <div class="side-cta">
        <button type="button" class="btn primary full-btn" onclick="openNew('order')">＋ Tạo Note đơn mới</button>
        <button type="button" class="btn full-btn" onclick="openNew('finance')">＋ Ghi khoản thu / chi</button>
      </div>
    </aside>

    <main class="main-stage">
      <section class="heading">
        <div class="heading-text">
          <h1 id="pageTitle">Tổng quan</h1>
          <p id="pageDesc">Theo dõi trực quan lợi nhuận, dòng tiền và việc cần xử lý.</p>
        </div>
        <div class="actions" id="pageActions"></div>
      </section>

      <section id="content" class="view-content" aria-live="polite"></section>
    </main>
  </div>

  <div class="overlay" id="modal" onmousedown="handleOverlayMouseDown(event)" onclick="handleOverlayClick(event)" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalBox">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">Thêm thông tin</h2>
          <p id="modalSub">Hệ thống tự động tính toán và gắn ngày giờ cập nhật.</p>
        </div>
        <button type="button" class="xbtn" onclick="requestCloseModal()" aria-label="Đóng biểu mẫu">×</button>
      </div>
      <form id="recordForm" novalidate onsubmit="saveRecord(event)" oninput="markFormDirty()">
        <div id="formError" class="form-error hidden" role="alert"></div>
        <div class="form" id="formFields"></div>
        <div id="calcPreviewZone"></div>
        <div id="recordHistoryZone" class="record-history-zone hidden"></div>
        <div class="modal-footer">
          <div class="danger-zone hidden" id="deleteZone">
            <button type="button" class="btn small danger-outline" id="deletePromptBtn" onclick="askDeleteModal()">Xóa mục này</button>
            <div class="delete-confirm hidden" id="deleteConfirmBox">
              <span class="delete-warn-text">Chắc chắn xóa?</span>
              <button type="button" class="btn small danger-solid" onclick="deleteRecord(true)">Xác nhận xóa</button>
              <button type="button" class="btn small" onclick="cancelDeleteModal()">Không</button>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" onclick="requestCloseModal()">Hủy</button>
            <button class="btn primary" type="submit" id="saveBtn">✓ Lưu thông tin</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <datalist id="customerSuggestions"></datalist>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
